name: mcp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run mcp self-tests
        run: |
          echo "mcp self-test runners: qa/probe_*.oo"
          echo "(stub: real CI requires ooda toolchain; see openOODA/ooda repo)"
      - name: Verify VERSION + api_surface
        run: |
          echo "Declared api_surface: $(grep api_surface VERSION | cut -d= -f2)"
          echo "Actual engine subdir count: $(ls -d engine/*/ | wc -l)"
          test "$(grep api_surface VERSION | cut -d= -f2)" = "6" || (echo "api_surface drift"; exit 1)
          test "$(ls -d engine/*/ | wc -l)" = "6" || (echo "engine subdir count != 6"; exit 1)
