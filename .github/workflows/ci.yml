name: mcp CI

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v0.6.17)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OO_LIST_AMBIENT_QUOTA: "8589934592"
    steps:
      - name: checkout mcp
        uses: actions/checkout@v4
        with:
          path: mcp
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: checkout openOODA
        uses: actions/checkout@v4
        with:
          repository: openOODA/openOODA
          path: openOODA
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: build oodar libs
        run: |
          make -C oodar/scripts -f Makefile modular
          test -f openOODA/rules.oot || { echo "missing openOODA/rules.oot"; exit 1; }
          command -v clang >/dev/null || { echo "clang required for oodac build (LLVM IR + oodar)"; exit 1; }
      - name: run suite proofs
        working-directory: ${{ github.workspace }}
        env:
          OO_LIST_AMBIENT_QUOTA: "8589934592"
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          "${OODA_COMPILER}" build mcp/qa/suite.oo -o /tmp/mcp_suite
          /tmp/mcp_suite
  build:
    runs-on: ubuntu-latest
    env:
      OO_LIST_AMBIENT_QUOTA: "8589934592"
    steps:
      - name: checkout mcp
        uses: actions/checkout@v4
        with:
          path: mcp
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: build oodar libs
        run: |
          make -C oodar/scripts -f Makefile modular
          command -v clang >/dev/null || { echo "clang required for oodac build (LLVM IR + oodar)"; exit 1; }
      - name: build native binary
        working-directory: ${{ github.workspace }}
        env:
          OO_LIST_AMBIENT_QUOTA: "8589934592"
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          mkdir -p dist
          "${OODA_COMPILER}" build mcp/cli/main.oo -o dist/ooda-mcp-linux-x86_64
          chmod +x dist/ooda-mcp-linux-x86_64
          (cd dist && sha256sum ooda-mcp-linux-x86_64 > ooda-mcp-linux-x86_64.sha256)
          ls -lh dist/
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error

  blackbox-gate:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    env:
      OO_LIST_AMBIENT_QUOTA: "8589934592"
    steps:
      - name: checkout mcp
        uses: actions/checkout@v4
        with:
          path: mcp
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: determinism double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/mcp
        env:
          OO_LIST_AMBIENT_QUOTA: "8589934592"
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/*.diff[12]' EXIT
          shopt -s nullglob
          count=0
          for f in qa/probe_*.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            "$OODA_COMPILER" tokens "$f" > "/tmp/${base}.diff1" 2>&1 || {
              echo "[blackbox-gate FAIL] diff non-zero exit on $f"
              exit 1
            }
            "$OODA_COMPILER" tokens "$f" > "/tmp/${base}.diff2" 2>&1 || {
              echo "[blackbox-gate FAIL] second diff non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.diff1" "/tmp/${base}.diff2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic diff on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.diff1" "/tmp/${base}.diff2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa/probe_*.oo in this repo"
            exit 0
          fi
          echo "[blackbox-gate OK] $count probes deterministic across double-run (oodac-native gate)"

  auto-release:
    needs: [test, build, blackbox-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
    with:
      artifact_pattern: 'release-assets-*'
      target_tag: ${{ inputs.target_tag || '' }}
